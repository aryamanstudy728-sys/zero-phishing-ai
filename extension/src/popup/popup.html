<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zero Phishing AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; color: #202124; width: 360px; padding: 16px; background: #fff; }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #e0e0e0; }
    .logo { width: 32px; height: 32px; background: linear-gradient(135deg, #1a73e8, #4285f4); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 14px; }
    .title { font-weight: 600; font-size: 16px; }
    .version { color: #80868b; font-size: 11px; margin-left: auto; }
    .section { margin-bottom: 20px; }
    .section-title { font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #5f6368; margin-bottom: 12px; }
    .status-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f1f3f4; }
    .status-row:last-child { border-bottom: none; }
    .status-label { color: #3c4043; }
    .status-value { display: flex; align-items: center; gap: 8px; }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; text-transform: uppercase; }
    .badge--connected { background: #e6f4ea; color: #1e7e34; }
    .badge--disconnected { background: #fce8e6; color: #c5221f; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 16px; border: 1px solid #dadce0; border-radius: 6px; font-size: 12px; font-weight: 500; color: #3c4043; background: #fff; cursor: pointer; transition: all 0.15s ease; text-decoration: none; }
    .btn:hover { background: #f8f9fa; border-color: #c0c4c8; }
    .btn:focus { outline: 2px solid #1a73e8; outline-offset: 2px; }
    .btn--primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
    .btn--primary:hover { background: #1557b0; border-color: #1557b0; }
    .btn--danger { color: #c5221f; border-color: #f59c98; }
    .btn--danger:hover { background: #fce8e6; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .stat { text-align: center; padding: 12px; background: #f8f9fa; border-radius: 8px; }
    .stat-value { font-size: 24px; font-weight: 700; color: #1a73e8; line-height: 1; }
    .stat-label { font-size: 10px; color: #5f6368; text-transform: uppercase; letter-spacing: 0.4px; margin-top: 4px; }
    .divider { height: 1px; background: #e0e0e0; margin: 16px 0; }
    .footer { text-align: center; color: #80868b; font-size: 11px; }
    .footer a { color: #1a73e8; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
    .loading { display: inline-block; width: 14px; height: 14px; border: 2px solid #e0e0e0; border-top-color: #1a73e8; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">ZP</div>
    <h1 class="title">Zero Phishing AI</h1>
    <span class="version" id="version">v0.1.0</span>
  </div>

  <div class="section">
    <div class="section-title">Account Status</div>
    <div class="status-row">
      <span class="status-label">Gmail</span>
      <div class="status-value">
        <span class="badge badge--disconnected" id="gmail-status">Disconnected</span>
        <button class="btn" id="gmail-connect" style="padding: 4px 10px; font-size: 11px;">Connect</button>
      </div>
    </div>
    <div class="status-row">
      <span class="status-label">Outlook</span>
      <div class="status-value">
        <span class="badge badge--disconnected" id="outlook-status">Disconnected</span>
        <button class="btn" id="outlook-connect" style="padding: 4px 10px; font-size: 11px;">Connect</button>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="section">
    <div class="section-title">Statistics</div>
    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="stat-analyzed">0</div>
        <div class="stat-label">Analyzed</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-safe">0</div>
        <div class="stat-label">Safe</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-flagged">0</div>
        <div class="stat-label">Flagged</div>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="section">
    <div class="section-title">Actions</div>
    <button class="btn btn--primary" id="analyze-current" style="width: 100%;">Analyze Current Email</button>
    <button class="btn" id="open-dashboard" style="width: 100%; margin-top: 8px;">Open Dashboard</button>
  </div>

  <div class="divider"></div>

  <div class="section">
    <div class="section-title">Data & Privacy</div>
    <button class="btn btn--danger" id="clear-data" style="width: 100%;">Clear All Local Data</button>
    <p style="font-size: 11px; color: #5f6368; margin-top: 8px;">Removes cached verdicts, feedback, and OAuth tokens.</p>
  </div>

  <div class="footer">
    <a href="https://zero-phishing.ai/privacy" target="_blank">Privacy Policy</a> · 
    <a href="https://zero-phishing.ai/terms" target="_blank">Terms</a> · 
    <a href="https://zero-phishing.ai/support" target="_blank">Support</a>
  </div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
