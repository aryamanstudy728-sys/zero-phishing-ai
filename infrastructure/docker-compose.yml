version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: zerophish-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zerophish
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zerophish-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: zerophish-backend
     environment:
       - APP_ENV=development
       - DEBUG=true
       - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/zerophish
       - REDIS_URL=redis://redis:6379/0
       - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
       - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
       - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
       - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
       - SAFE_BROWSING_API_KEY=${SAFE_BROWSING_API_KEY}
       - PHISHTANK_API_KEY=${PHISHTANK_API_KEY}
       - GEMINI_API_KEY=${GEMINI_API_KEY}
       - JWT_SECRET_KEY=dev-secret-change-in-production
       - USER_HASH_SECRET=dev-user-hash-secret-change-in-production
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend/app:/app/app
      - ../backend/alembic:/app/alembic

volumes:
  postgres_data:
  redis_data: